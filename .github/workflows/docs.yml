name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r docs/requirements.txt
      # Note: --strict is not used because griffe emits warnings about missing
      # type annotations in CASTLE's source code. These are cosmetic and do not
      # affect the built documentation. Fix by adding type hints to the source.
      - run: mkdocs gh-deploy --force
