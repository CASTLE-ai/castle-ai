# CASTLE AI — Docker Compose (GPU, recommended)
# Usage: docker compose up --build
# Requires: NVIDIA Container Toolkit installed on the host
# See: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  castle:
    build:
      context: .
      args:
        DEVICE: gpu
    image: castle-ai/castle:latest
    container_name: castle-gpu
    ports:
      - "7860:7860"
    volumes:
      # Persist user projects
      - ./projects:/data
      # Persist downloaded model checkpoints
      - castle-models:/models
      # (optional) mount demo videos
      - ./demo:/app/demo:ro
    environment:
      - CASTLE_DEVICE=auto
      - CASTLE_DATA=/data
      - HDF5_USE_FILE_LOCKING=FALSE
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  castle-models:
    driver: local
