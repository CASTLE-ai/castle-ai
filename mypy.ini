; CASTLE mypy configuration (UX-04 / P2-E)
;
; Run from the repo root:
;     mypy castle
;
; Tiered strictness — per the audit decision in
; .claude/plans/role-software-enumerated-sifakis.md (D7):
;
;   castle.core, castle.service  → strict (paper-grade core)
;   castle.utils                 → normal  (3rd-party-heavy I/O wrappers)
;   castle.ui, castle.desktop    → loose   (Gradio + PyQt make strict noisy)
;   castle.aot                   → ignored (vendored SAM/DeAOT, no upstream stubs)
;
; Install: pip install -r requirements-dev.txt

[mypy]
python_version = 3.10
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
no_implicit_optional = True
namespace_packages = True
explicit_package_bases = True
mypy_path = .

[mypy-castle.core.*]
; Strict for the algorithmic core — reproducibility & error-handling rules
; rely on type-checker enforcement.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True
strict_equality = True

[mypy-castle.service.*]
; Same strictness applies to the service layer — it is the public seam
; between CLI / UI / MCP and the core.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True
strict_equality = True

[mypy-castle.utils.*]
; Normal mode — these modules wrap PyAV / h5py / cv2 whose typing is
; partial or absent. Requiring strict defs here yields more noise than
; signal at this stage.
disallow_untyped_defs = False

[mypy-castle.ui.*]
; UI handlers return ``gr.update(...)`` and accept ``gr.State`` objects
; whose generic types are opaque. Keep type checks on but don't demand
; full annotations.
disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-castle.desktop.*]
disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-castle.aot.*]
; Vendored SAM + DeAOT — out of scope for this project's mypy guarantees.
ignore_errors = True

; ---------------------------------------------------------------------------
; Third-party libraries without published stubs
; ---------------------------------------------------------------------------

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-av.*]
ignore_missing_imports = True

[mypy-h5py.*]
ignore_missing_imports = True

[mypy-umap.*]
ignore_missing_imports = True

[mypy-hdbscan.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-gradio.*]
ignore_missing_imports = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-cuml.*]
ignore_missing_imports = True

[mypy-cupy.*]
ignore_missing_imports = True

[mypy-gdown.*]
ignore_missing_imports = True

[mypy-natsort.*]
ignore_missing_imports = True

[mypy-termcolor.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
